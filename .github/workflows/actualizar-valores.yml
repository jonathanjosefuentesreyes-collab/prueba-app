name: Actualizar valores (semanal)

# Refresca UF/UTM (defaults de las calculadoras) una vez por semana. Si cambian, hace
# commit y eso dispara el auto-deploy de Render con los valores frescos. También se puede
# correr a mano desde la pestaña Actions → "Run workflow".
on:
  schedule:
    - cron: "0 12 * * 1" # lunes 12:00 UTC (~08:00 en Chile)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refrescar valores
        run: node 3-aplicacion/scripts/actualizar-valores.mjs
      - name: Commit si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 3-aplicacion/src/lib/valores.json
          if git diff --staged --quiet; then
            echo "Sin cambios en los valores."
          else
            git commit -m "chore: actualiza UF/UTM (cron semanal)"
            git push
          fi
